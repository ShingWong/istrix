[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "istrix"
version = "0.1.0"
description = "AI-powered penetration testing orchestration toolkit"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "iStrix Contributors"}]
keywords = ["security", "pentest", "nmap", "recon", "vulnerability", "scanning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "typer>=0.25.0,<0.26.0",
    "rich>=15.0.0,<16.0.0",
    "pydantic>=2.13.0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
ai = [
    "langchain>=1.2.0,<2.0.0",
    "langchain-openai>=1.2.0,<2.0.0",
    "langchain-anthropic>=1.4.0,<2.0.0",
]
cve = [
    "nvdlib>=0.8.0,<0.9.0",
]
report = [
    "weasyprint>=68.0,<69.0.0",
]
security = [
    "pip-audit>=2.8,<3.0",
]
server = [
    "fastapi>=0.136.0,<1.0",
    "uvicorn>=0.46.0,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.31.0,<0.32.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.18,<2.0",
    "feedparser>=6.0,<7.0",
    "aiofiles>=25.0,<26.0",
    "python-multipart>=0.0,<1.0",
    "pgvector>=0.4,<0.5",
]
dev = [
    "istrix[security]",
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.12.0,<1.0",
    "build>=1.2,<2.0",
]
all = [
    "istrix[ai,cve,report,security,server]",
]

[project.scripts]
istrix = "istrix.main:app"
istrix-server = "istrix.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
istrix = ["config/*.yaml", "config/*.yml"]
