name: Web Paths Sync

on:
  schedule:
    - cron: "0 6 * * 3"  # Every Wednesday at 06:00 UTC (offset from vulndb)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync web paths
        id: sync
        run: |
          python scripts/sync_web_paths.py
          echo "changed=$?" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.sync.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-update/web-paths
          base: develop
          title: "chore: sync common web paths"
          body: |
            Automated web path list sync from curated sources (SecLists, assetnote).

            - New unique paths merged
            - Total paths capped at 5000
            - Automatically merged by CI pipeline
          labels: |
            automated
            security
            web-paths
          commit-message: "chore: sync web paths from curated sources"
